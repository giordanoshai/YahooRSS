<head>

  <style>
    :root {
      --bg-dark: #070a13;
      --panel-bg: rgba(13, 20, 36, 0.88);
      --border-color: rgba(56, 189, 248, 0.25);
      --primary-cyan: #38bdf8;
      --neon-emerald: #10b981;
      --neon-amber: #f59e0b;
      --neon-rose: #f43f5e;
      --neon-purple: #a855f7;
      --neon-gold: #fbbf24;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI Header HUD */
    .hud-header {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      max-width: 520px;
    }

    .hud-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      -webkit-text-fill-color: #38bdf8;
      font-weight: 600;
    }

    .hud-desc {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* Metric Counters */
    .hud-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .metric-num {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* Bottom Toolbar */
    .toolbar-dock {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      padding: 10px 18px;
      border-radius: 50px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .tool-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .tool-btn.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    .speed-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-sub);
      padding: 0 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .speed-slider {
      width: 80px;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Step Timeline Navigator */
    .timeline-bar {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(56, 189, 248, 0.3) transparent;
      width: 250px;
    }

    .timeline-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .step-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(56, 189, 248, 0.2);
    }

    .step-item.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.5);
      font-weight: 600;
      color: #38bdf8;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .step-item.active .step-dot {
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      transform: scale(1.3);
    }

    /* Detail Modal / Drawer */
    .detail-drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 480px;
      height: 100%;
      background: rgba(10, 15, 28, 0.94);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border-color);
      z-index: 100;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -15px 0 50px rgba(0, 0, 0, 0.8);
      overflow-y: auto;
    }

    .detail-drawer.open {
      transform: translateX(0);
    }

    .drawer-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }

    .drawer-close:hover {
      background: rgba(244, 63, 94, 0.3);
      border-color: #f43f5e;
      color: #fff;
    }

    .drawer-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .drawer-title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .drawer-section {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 16px;
    }

    .section-heading {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-body {
      font-size: 13px;
      line-height: 1.65;
      color: #cbd5e1;
    }

    .code-block {
      background: #040711;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre-wrap;
      margin-top: 8px;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }

    /* Tooltip */
    #hover-tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 20;
      opacity: 0;
      transform: translate(-50%, -120%);
      transition: opacity 0.15s ease;
      max-width: 260px;
    }
  </style>

</head>

  <script>
    // =========================================================================
    // 10 核心工序完整知识体系与技术定义
    // =========================================================================
    const PIPELINE_NODES = [
      {
        id: "step-1",
        stepIndex: 1,
        title: "抓取",
        subtitle: "多级降级与反爬抓取",
        color: 0x38bdf8, // Cyan
        pos: { x: -36, y: 0, z: -15 },
        tooltip: "Yahoo Finance 首页与流式抓取，curl_cffi 指纹伪装与多级备用容器",
        logic: "从 Yahoo Finance latest-news 页面高频采集最新财经新闻，采用多级降级策略应对反爬与页面结构变化。支持 stream-items 动态流、备用 data-testid 选择器与全局文章锚点兜底。通过 curl_cffi Chrome 指纹伪装与指数退避重试彻底避免 403 封锁，正文通过 ThreadPoolExecutor 批量并发由 trafilatura 精准提取。",
        tech: "curl_cffi (impersonate='chrome') + BeautifulSoup4 多级流式选择器 + trafilatura 智能正文抽取 + ThreadPoolExecutor 4 线程并发 + 媒体黑名单预先剔除（如 Motley Fool, Zacks, Seeking Alpha 商业广告）。",

        sample: `{\n  "title": "Fed Signals Caution on Rate Cuts Amid Sticky Inflation",\n  "url": "https://finance.yahoo.com/news/fed-signals-caution-094122.html",\n  "partner": "Bloomberg",\n  "content": "Federal Reserve officials expressed caution Wednesday..."\n}`

      {
        id: "step-2",
        stepIndex: 2,
        title: "初筛与事件去重",
        subtitle: "17+正则规则与罕见词倒排索引",
        color: 0xf59e0b, // Amber
        pos: { x: -24, y: 0, z: -6 },
        tooltip: "过滤 17+ 种个人理财套路文，基于 StoryIndex 罕见词倒排索引识别同一事件的第 N 篇重复报道",
        logic: "在入库前执行双重初筛：1. 套路文清洗：通过 17+ 组正则表达式与负向关键词拦截退休理财、房贷、401(k)、无脑荐股等无关垃圾，直接物理丢弃；2. 事件级去重（StoryIndex）：基于过去 24 小时首发新闻建立罕见词倒排索引（词频 DF<=2 为事件特征），共享 >=2 个罕见词即判定为同事件重复报道。重复报道照样入库（带 is_duplicate=True 标记）以实现幂等并供审计，但不抓正文、不调模型、不推 RSS。",
        tech: "StoryIndex 罕见词逆文档频率索引 (RARE_DF_MAX=2, RARE_HIT_MIN=2) + 停用词/复数归一化 depluralize + 17 组高精度套路文正则表达式 + Cold-start 样本冷启动保护 (MIN_CORPUS_SIZE=30)。",

        code: `index = StoryIndex(origin_news)\ndup_of, reason = index.find_duplicate(title)\nif is_dup:\n    row["is_duplicate"] = True  # 标记入库，后续跳过模型消耗\nelse:\n    index.add(title)            # 仅首发新闻参与特征词频统计`,

        color: 0xa855f7, // Purple
        pos: { x: -12, y: 0, z: 2 },

        code: `eval_res = evaluate_importance_and_sentiment(title, content)\n# 输出: importance.level, sentiment.score, relate_tickers`,

        subtitle: "分流决策门 (Low 快速旁路)",
        color: 0x10b981, // Emerald

        tooltip: "Low 级新闻直接跳过二次 LLM 调用，节约 50%+ Token 成本；Medium/High 进入精细化摘要",
        logic: "核心成本与效率优化分水岭。如果初评为 Low 级别：直接保留原英文标题，拼接精简模板（包含第一步已提取的情绪和个股数据），立即落库更新，彻底跳过第二次耗费巨大 Token 的长文翻译与摘要调用；如果是 Medium 或 High 级别：放行进入深度处理阶段，保证高价值新闻得到高质量的中文化呈现与核心事实提炼。",

    // =========================================================================
    // Three.js 场景构建与 3D 渲染核心
    // =========================================================================
    let scene, camera, renderer, controls;
    let nodeObjects = [];
    let splineCurves = [];
    let particleSystems = [];
    let activeStepIndex = 1;
    let isPlaying = true;
    let speedFactor = 1.0;
    let isAutoTouring = false;
    let tourTween = null;

    const container = document.getElementById("webgl-container");
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function initScene() {
      // 1. Scene & Background
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070a13);
      scene.fog = new THREE.FogExp2(0x070a13, 0.015);

      // 2. Camera
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 42, 58);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // 4. OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 + 0.05;
      controls.minDistance = 10;
      controls.maxDistance = 180;
      controls.target.set(6, 0, -2);

      // 5. Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
      dirLight.position.set(20, 50, 30);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const purplePoint = new THREE.PointLight(0xa855f7, 2, 80);
      purplePoint.position.set(-10, 20, 10);
      scene.add(purplePoint);

      const goldPoint = new THREE.PointLight(0xfbbf24, 2.5, 90);
      goldPoint.position.set(25, 20, -10);
      scene.add(goldPoint);

      // 6. Ground Cyber Grid
      const gridHelper = new THREE.GridHelper(140, 70, 0x1e293b, 0x0f172a);
      gridHelper.position.y = -7;
      scene.add(gridHelper);

      // Background Starfield Particles
      createStarfield();

      // Build 3D Nodes & Pipelines
      createPipelineNodes();
      createConnectingSplines();
      createParticleFlows();

      // Events
      window.addEventListener("resize", onWindowResize);
      renderer.domElement.addEventListener("pointermove", onPointerMove);
      renderer.domElement.addEventListener("click", onSceneClick);

      // Build UI Timeline List
      initTimelineUI();
    }

    // Starfield Background
    function createStarfield() {
      const starGeo = new THREE.BufferGeometry();
      const count = 1200;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 250;
        positions[i + 1] = Math.random() * 80 - 10;
        positions[i + 2] = (Math.random() - 0.5) * 250;
      }
      starGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({ color: 0x64748b, size: 0.8, transparent: true, opacity: 0.5 });
      const stars = new THREE.Points(starGeo, starMat);
      scene.add(stars);
    }

    // Create 3D Stations
    function createPipelineNodes() {
      PIPELINE_NODES.forEach((data, index) => {
        const group = new THREE.Group();
        group.position.set(data.pos.x, data.pos.y, data.pos.z);
        group.userData = data;

        // Base Hexagonal Platform
        const baseGeo = new THREE.CylinderGeometry(3.6, 4.2, 0.6, 6);
        const baseMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          roughness: 0.4,
          metalness: 0.8
        });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.receiveShadow = true;
        group.add(baseMesh);

        // Glowing Platform Ring
        const ringGeo = new THREE.RingGeometry(3.8, 4.2, 6);
        const ringMat = new THREE.MeshBasicMaterial({
          color: data.color,
          side: THREE.DoubleSide
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = -Math.PI / 2;
        ringMesh.position.y = 0.32;
        group.add(ringMesh);

        // Core Crystal / Polyhedron
        const coreGeo = new THREE.OctahedronGeometry(1.6, 0);
        const coreMat = new THREE.MeshStandardMaterial({
          color: data.color,
          emissive: data.color,
          emissiveIntensity: 0.4,
          roughness: 0.2,
          metalness: 0.9,
          wireframe: false
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.position.y = 2.4;
        group.add(coreMesh);

        // Surrounding Orbital Rings
        const orbitGeo = new THREE.TorusGeometry(2.3, 0.06, 8, 32);
        const orbitMat = new THREE.MeshBasicMaterial({ color: data.color, transparent: true, opacity: 0.6 });
        const orbit1 = new THREE.Mesh(orbitGeo, orbitMat);
        orbit1.position.y = 2.4;
        orbit1.rotation.x = Math.PI / 3;
        group.add(orbit1);

        const orbit2 = new THREE.Mesh(orbitGeo, orbitMat);
        orbit2.position.y = 2.4;
        orbit2.rotation.y = Math.PI / 3;
        group.add(orbit2);

        // Light Pillar
        const pillarGeo = new THREE.CylinderGeometry(0.8, 0.8, 6, 16, 1, true);
        const pillarMat = new THREE.MeshBasicMaterial({
          color: data.color,
          transparent: true,
          opacity: 0.12,
          side: THREE.DoubleSide
        });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.y = 3;
        group.add(pillar);

        // References for animation
        group.userData.coreMesh = coreMesh;
        group.userData.orbit1 = orbit1;
        group.userData.orbit2 = orbit2;
        group.userData.ringMesh = ringMesh;

        scene.add(group);
        nodeObjects.push(group);
      });
    }

    // Connect Pipeline Splines
    function createConnectingSplines() {
      // 1. Main Path: Step 1 -> 2 -> 3 -> 4
      const p1 = nodeObjects[0].position.clone().add(new THREE.Vector3(0, 2.4, 0));
      const p2 = nodeObjects[1].position.clone().add(new THREE.Vector3(0, 2.4, 0));
      const p3 = nodeObjects[2].position.clone().add(new THREE.Vector3(0, 2.4, 0));
      const p4 = nodeObjects[3].position.clone().add(new THREE.Vector3(0, 2.4, 0));

      // 2. High Path from Step 4 -> 5 -> 6 -> 7
      const p5 = nodeObjects[4].position.clone().add(new THREE.Vector3(0, 2.4, 0));
      const p6 = nodeObjects[5].position.clone().add(new THREE.Vector3(0, 2.4, 0));
      const p7 = nodeObjects[6].position.clone().add(new THREE.Vector3(0, 2.4, 0));

      // 3. Low Bypass Route from Step 4 directly to Step 7 (saves token!)
      const p4_bypass_mid = new THREE.Vector3(16, -3, 10);

      // 4. Step 7 -> 8 -> 9
      const p8 = nodeObjects[7].position.clone().add(new THREE.Vector3(0, 2.4, 0));
      const p9 = nodeObjects[8].position.clone().add(new THREE.Vector3(0, 2.4, 0));

      // 5. Daily Summary Loop: High-news aggregation from Step 3 & 7 to Step 10
      const p10 = nodeObjects[9].position.clone().add(new THREE.Vector3(0, 2.4, 0));

      // Define Curves
      const curveMainInflow = new THREE.CatmullRomCurve3([p1, p2, p3, p4]);
      const curveHighProcess = new THREE.CatmullRomCurve3([p4, p5, p6, p7]);
      const curveLowBypass = new THREE.CatmullRomCurve3([p4, p4_bypass_mid, p7]);
      const curveRssOutflow = new THREE.CatmullRomCurve3([p7, p8, p9]);
      const curveMacroDaily = new THREE.CatmullRomCurve3([p3, new THREE.Vector3(0, 4, -8), p10]);

      splineCurves = [
        { curve: curveMainInflow, color: 0x38bdf8, type: "main" },
        { curve: curveHighProcess, color: 0x10b981, type: "high" },
        { curve: curveLowBypass, color: 0xf59e0b, type: "low_bypass" },
        { curve: curveRssOutflow, color: 0x14b8a6, type: "rss" },
        { curve: curveMacroDaily, color: 0xfbbf24, type: "daily" }
      ];

      // Draw Glowing Tube Meshes for all curves
      splineCurves.forEach(({ curve, color, type }) => {
        const tubeGeo = new THREE.TubeGeometry(curve, 70, 0.25, 8, false);
        const tubeMat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: type === "low_bypass" ? 0.35 : 0.6
        });
        const tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
        scene.add(tubeMesh);
      });
    }

    // Animated Particles on Curves
    function createParticleFlows() {
      splineCurves.forEach(({ curve, color, type }) => {
        const particleCount = type === "low_bypass" ? 25 : 45;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const offsets = [];

        for (let i = 0; i < particleCount; i++) {
          offsets.push(i / particleCount);
          const pt = curve.getPoint(i / particleCount);
          positions[i * 3] = pt.x;
          positions[i * 3 + 1] = pt.y;
          positions[i * 3 + 2] = pt.z;
        }

        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({
          color: color,
          size: type === "high" || type === "daily" ? 1.6 : 1.1,
          transparent: true,
          opacity: 0.95
        });

        const points = new THREE.Points(geo, mat);
        scene.add(points);

        particleSystems.push({
          points,
          curve,
          offsets,
          count: particleCount,
          type
        });
      });
    }

    // =========================================================================
    // UI Timeline & Interaction Logic
    // =========================================================================
    function initTimelineUI() {
      const timelineBar = document.getElementById("timeline-bar");
      PIPELINE_NODES.forEach((node) => {
        const item = document.createElement("div");
        item.className = `step-item ${node.stepIndex === 1 ? "active" : ""}`;
        item.id = `step-item-${node.stepIndex}`;
        item.innerHTML = `
          <div class="step-dot" style="${node.stepIndex === 1 ? 'background:' + '#' + node.color.toString(16) : ''}"></div>
          <span>${String(node.stepIndex).padStart(2, '0')}. ${node.title}</span>
        `;
        item.addEventListener("click", () => {
          focusOnStep(node.stepIndex, true);
        });
        timelineBar.appendChild(item);
      });

      // Controls
      document.getElementById("btn-toggle-play").addEventListener("click", togglePlay);
      document.getElementById("speed-slider").addEventListener("input", (e) => {
        speedFactor = parseFloat(e.target.value);
        document.getElementById("speed-val").textContent = speedFactor.toFixed(1) + "x";
      });
      document.getElementById("btn-prev-step").addEventListener("click", () => {
        let prev = activeStepIndex - 1;
        if (prev < 1) prev = PIPELINE_NODES.length;
        focusOnStep(prev, true);
      });
      document.getElementById("btn-next-step").addEventListener("click", () => {
        let next = activeStepIndex + 1;
        if (next > PIPELINE_NODES.length) next = 1;
        focusOnStep(next, true);
      });
      document.getElementById("btn-auto-tour").addEventListener("click", toggleAutoTour);
      document.getElementById("btn-reset-cam").addEventListener("click", resetCamera);
      document.getElementById("drawer-close-btn").addEventListener("click", closeDrawer);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById("btn-toggle-play");
      const icon = document.getElementById("play-icon");
      if (isPlaying) {
        icon.textContent = "⏸";
        btn.innerHTML = `<span id="play-icon">⏸</span> 暂停粒子流`;
      } else {
        icon.textContent = "▶";
        btn.innerHTML = `<span id="play-icon">▶</span> 继续流动`;
      }
    }

    function toggleAutoTour() {
      isAutoTouring = !isAutoTouring;
      const btn = document.getElementById("btn-auto-tour");
      if (isAutoTouring) {
        btn.classList.add("active");
        btn.innerHTML = `⏹ 停止巡游`;
        runTourSequence();
      } else {
        btn.classList.remove("active");
        btn.innerHTML = `🎥 自动巡游`;
        if (tourTween) tourTween.kill();
      }
    }

    function runTourSequence() {
      if (!isAutoTouring) return;
      focusOnStep(activeStepIndex, true);
      tourTween = gsap.delayedCall(5.5 / speedFactor, () => {
        if (!isAutoTouring) return;
        activeStepIndex = (activeStepIndex % PIPELINE_NODES.length) + 1;
        runTourSequence();
      });
    }

    function resetCamera() {
      if (tourTween) tourTween.kill();
      isAutoTouring = false;
      document.getElementById("btn-auto-tour").classList.remove("active");
      document.getElementById("btn-auto-tour").innerHTML = `🎥 自动巡游`;

      gsap.to(camera.position, { x: 0, y: 42, z: 58, duration: 1.5, ease: "power2.inOut" });
      gsap.to(controls.target, { x: 6, y: 0, z: -2, duration: 1.5, ease: "power2.inOut" });
      closeDrawer();
    }

    function focusOnStep(index, openDetails = false) {
      activeStepIndex = index;
      const nodeData = PIPELINE_NODES[index - 1];
      const targetObj = nodeObjects[index - 1];

      // Update Timeline active state
      document.querySelectorAll(".step-item").forEach((el, idx) => {
        if (idx === index - 1) {
          el.classList.add("active");
          el.querySelector(".step-dot").style.background = "#" + nodeData.color.toString(16);
        } else {
          el.classList.remove("active");
          el.querySelector(".step-dot").style.background = "rgba(255,255,255,0.2)";
        }
      });

      // Smooth Camera Animation
      const targetPos = targetObj.position;
      const camOffset = new THREE.Vector3(12, 14, 20);
      const newCamPos = targetPos.clone().add(camOffset);

      gsap.to(camera.position, {
        x: newCamPos.x,
        y: newCamPos.y,
        z: newCamPos.z,
        duration: 1.3,
        ease: "power2.out"
      });

      gsap.to(controls.target, {
        x: targetPos.x,
        y: targetPos.y + 2,
        z: targetPos.z,
        duration: 1.3,
        ease: "power2.out"
      });

      if (openDetails) {
        showDrawer(nodeData);
      }
    }

    function showDrawer(data) {
      const drawer = document.getElementById("detail-drawer");
      document.getElementById("drawer-step-tag").textContent = `STEP ${String(data.stepIndex).padStart(2, '0')}`;
      document.getElementById("drawer-step-tag").style.borderColor = "#" + data.color.toString(16);
      document.getElementById("drawer-step-tag").style.color = "#" + data.color.toString(16);

      document.getElementById("drawer-title").textContent = `${data.stepIndex}. ${data.title} (${data.subtitle})`;
      document.getElementById("drawer-logic").textContent = data.logic;
      document.getElementById("drawer-tech").textContent = data.tech;

      // Pills
      const pillContainer = document.getElementById("drawer-pills");
      pillContainer.innerHTML = "";
      data.pills.forEach((p) => {
        const span = document.createElement("span");
        span.className = "pill";
        span.textContent = p;
        pillContainer.appendChild(span);
      });

      document.getElementById("drawer-code").textContent = data.code;
      document.getElementById("drawer-data").textContent = data.sample;

      drawer.classList.add("open");
    }

    function closeDrawer() {
      document.getElementById("detail-drawer").classList.remove("open");
    }

    // Raycasting & Hover
    function onPointerMove(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(nodeObjects, true);
      const tooltip = document.getElementById("hover-tooltip");

      if (intersects.length > 0) {
        let parentGroup = intersects[0].object;
        while (parentGroup.parent && !parentGroup.userData.title) {
          parentGroup = parentGroup.parent;
        }

        if (parentGroup.userData.title) {
          const d = parentGroup.userData;
          document.getElementById("tt-title").textContent = `${d.stepIndex}. ${d.title}`;
          document.getElementById("tt-desc").textContent = d.tooltip;
          tooltip.style.left = e.clientX + "px";
          tooltip.style.top = e.clientY + "px";
          tooltip.style.opacity = "1";
          document.body.style.cursor = "pointer";
          return;
        }
      }

      tooltip.style.opacity = "0";
      document.body.style.cursor = "default";
    }

    function onSceneClick(e) {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(nodeObjects, true);
      if (intersects.length > 0) {
        let parentGroup = intersects[0].object;
        while (parentGroup.parent && !parentGroup.userData.stepIndex) {
          parentGroup = parentGroup.parent;
        }
        if (parentGroup.userData.stepIndex) {
          focusOnStep(parentGroup.userData.stepIndex, true);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // =========================================================================
    // 渲染循环 (Render Loop)
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Controls update
      controls.update();

      // Station Idle Rotations
      nodeObjects.forEach((group, idx) => {
        if (group.userData.coreMesh) {
          group.userData.coreMesh.rotation.y += 0.8 * delta;
          group.userData.coreMesh.rotation.x = Math.sin(time * 1.5 + idx) * 0.2;
          group.userData.coreMesh.position.y = 2.4 + Math.sin(time * 2 + idx) * 0.2;
        }
        if (group.userData.orbit1) group.userData.orbit1.rotation.z += 0.5 * delta;
        if (group.userData.orbit2) group.userData.orbit2.rotation.x += 0.6 * delta;
      });

      // Flowing Particle Streams
      if (isPlaying) {
        particleSystems.forEach((ps) => {
          const positions = ps.points.geometry.attributes.position.array;
          for (let i = 0; i < ps.count; i++) {
            ps.offsets[i] = (ps.offsets[i] + delta * 0.12 * speedFactor) % 1.0;
            const pt = ps.curve.getPoint(ps.offsets[i]);
            positions[i * 3] = pt.x;
            positions[i * 3 + 1] = pt.y;
            positions[i * 3 + 2] = pt.z;
          }
          ps.points.geometry.attributes.position.needsUpdate = true;
        });
      }

      renderer.render(scene, camera);
    }

    // Startup
    initScene();
    animate();
  </script>
</body>
